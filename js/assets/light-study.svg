<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17131D"/>
      <stop offset="1" stop-color="#090A10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(260 0 0 220 450 285)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9A47C" stop-opacity=".34"/>
      <stop offset="1" stop-color="#E9A47C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="280" y1="150" x2="620" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6D5B9"/>
      <stop offset=".48" stop-color="#C68C9B"/>
      <stop offset="1" stop-color="#7762A6"/>
    </linearGradient>
    <filter id="blur" x="80" y="20" width="740" height="560" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="450" cy="285" r="250" fill="url(#glow)"/>
  <ellipse cx="450" cy="300" rx="220" ry="155" fill="#C58A9D" opacity=".15" filter="url(#blur)"/>

  <g stroke="#D9B7C8" stroke-opacity=".23">
    <ellipse cx="450" cy="300" rx="300" ry="95" transform="rotate(-28 450 300)"/>
    <ellipse cx="450" cy="300" rx="300" ry="95" transform="rotate(28 450 300)"/>
    <ellipse cx="450" cy="300" rx="245" ry="145"/>
  </g>

  <circle cx="450" cy="300" r="112" fill="url(#orb)" fill-opacity=".82"/>
  <circle cx="450" cy="300" r="112" stroke="#FFE8DA" stroke-opacity=".65"/>

  <g fill="#F8D9C7">
    <circle cx="450" cy="188" r="4"/>
    <circle cx="545" cy="240" r="3"/>
    <circle cx="532" cy="373" r="4"/>
    <circle cx="362" cy="380" r="3"/>
    <circle cx="337" cy="258" r="4"/>
    <circle cx="450" cy="300" r="5" fill="#FFF5ED"/>
  </g>

  <g stroke="#EBC6CF" stroke-opacity=".62">
    <path d="M450 188V300L545 240"/>
    <path d="M450 300L532 373"/>
    <path d="M450 300L362 380"/>
    <path d="M450 300L337 258"/>
  </g>

  <g fill="#F3E8E5" font-family="Arial, sans-serif">
    <text x="48" y="58" font-size="12" letter-spacing="3" opacity=".7">NOCTURNE / LIGHT STUDY</text>
    <text x="48" y="550" font-size="11" letter-spacing="2" opacity=".55">FORM · MOTION · PRESENCE</text>
    <text x="850" y="550" font-size="11" text-anchor="end" opacity=".55">FIG. 001</text>
  </g>
</svg>
